server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: taskboard
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agile_taskboard?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: xcy@1992asd
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境记得换成随机生成的长密钥，别偷懒直接用这个
  secret: agileTaskBoardJwtSecretKeyForHS256AlgorithmPleaseChangeInProd2026
  expire-hours: 12

logging:
  level:
    com.agile.taskboard: debug
